<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Routine">
<title>Class Tracker (e-paper) – CST 4th Semester (B)</title>
<style>
:root{--bg:#F3F1EC;--card:#FFFFFF;--ink:#1B2230;--mute:#667085;--line:#E1DDD3;--soft:#ECE8DF;--tbg:#1B2230;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141C;--card:#1A2030;--ink:#EEF1F6;--mute:#98A2B3;--line:#2A3246;--soft:#232B3D;--tbg:#252E45}}
:root[data-theme="dark"]{--bg:#10141C;--card:#1A2030;--ink:#EEF1F6;--mute:#98A2B3;--line:#2A3246;--soft:#232B3D;--tbg:#252E45}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;min-height:100%}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 12px 12px 18px;margin-bottom:12px}
.top .pill.icon-btn{display:flex;align-items:center;justify-content:center;padding:9px 10px;aspect-ratio:1;cursor:pointer}
#profileSheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#profileSheet.open{display:block}
.top .ck{flex:1;min-width:0;line-height:1}
.top .ck small{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
#clk{display:flex;align-items:baseline;gap:4px;font-family:Georgia,'Times New Roman',serif;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
#clk .hm{font-size:30px;letter-spacing:-.02em}
#clk .ap{font-size:13px;color:var(--mute);font-weight:600;margin-left:2px}
.top select{font:inherit;font-size:14px;font-weight:600;padding:9px 12px;border-radius:13px;border:1px solid var(--line);background:var(--soft);color:var(--ink);outline:none;cursor:pointer;max-width:128px}
.top select:focus-visible{outline:3px solid #4C8DF6;outline-offset:2px}
.top .pill{font-size:14px;font-weight:600;padding:9px 14px;border-radius:13px;background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:400px){.top{padding-left:14px;gap:8px}#clk .hm{font-size:26px}.top select{max-width:104px;padding:9px 8px}.top .pill{padding:9px 11px}}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;position:relative;font:inherit;font-size:14px;font-weight:500;padding:9px 0;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card .days{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.card .day{font-size:11px;line-height:1;padding:3px 6px;border-radius:7px;background:var(--soft);color:var(--mute)}
.card .day.today{background:var(--ink);color:var(--bg)}
.tabs button.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:#E5484D}
button:focus-visible{outline:3px solid #4C8DF6;outline-offset:2px}
#slot>article{border-radius:24px;color:#fff;padding:20px;animation:swap .55s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.tag{display:inline-block;background:rgba(255,255,255,.18);padding:2px 12px;border-radius:99px;font-size:13px;font-weight:500}
.timer{background:var(--tbg)}
.timer .cd,.now .rl b{font-family:Georgia,'Times New Roman',serif;font-weight:800;font-variant-numeric:tabular-nums}
.timer .msg{font-family:Georgia,'Times New Roman',serif;font-weight:800;font-size:25px;line-height:1.2;margin:18px 0 6px}
.timer .lbl{font-size:14px;opacity:.8}
.timer .lbl b{font-family:Georgia,'Times New Roman',serif;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;margin-left:4px}
.timer .up{display:flex;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.timer .up i{width:5px;border-radius:5px;flex:none}
.timer .up small{display:block;opacity:.7;font-size:13px}
.timer .up b{font-weight:600;font-size:16px}
.now{background:var(--c)}
.now .code{margin-top:12px;font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
.now h2{font-family:Georgia,'Times New Roman',serif;font-weight:800;font-size:25px;line-height:1.18;margin:2px 0 8px}
.now .meta{display:flex;gap:8px;flex-wrap:wrap}
.now .meta span{background:rgba(255,255,255,.16);border-radius:10px;padding:2px 11px;font-size:14px}
.now .foot{margin-top:20px}
.rl{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;opacity:.95}
.rl b{font-size:30px;letter-spacing:-.5px}
.rl.s{font-size:12.5px;opacity:.75;margin-top:7px}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.22);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width 1s linear}
h4{font-weight:600;font-size:14px;color:var(--mute);margin:22px 4px 10px}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 12px;margin-bottom:9px}
.card .st{width:5px;align-self:stretch;border-radius:5px;background:var(--c);flex:none}
.card .bd{flex:1;min-width:0}
.card .tm{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.card h3{font-size:16px;font-weight:600;line-height:1.3;margin:1px 0 3px}
.card .sub{font-size:13.5px;color:var(--mute)}
.card .sd{text-align:right;flex:none}
.card .sd small{display:block;font-size:12px;color:var(--mute)}
.card .sd b{font-family:Georgia,'Times New Roman',serif;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.card.up{opacity:.62}
.card.done{opacity:.4;padding:10px 14px 10px 12px}
.card.done h3{font-size:14.5px;font-weight:500}
.tel{color:inherit;text-decoration:none;font-variant-numeric:tabular-nums}
.card .tel{color:var(--ink);font-weight:500}
.brk{margin:0 0 9px 17px;padding-left:12px;border-left:2px dotted var(--line);color:var(--mute);font-size:13px}
.tr{display:flex;gap:10px;align-items:center}
.pill{font:inherit;font-size:13px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
#sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.open{display:block}
.sh{max-width:560px;margin:0 auto;padding:0 14px 60px}
.sh header{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:14px 0 10px}
.sh header b{font-family:Georgia,'Times New Roman',serif;font-size:19px;font-weight:800}
.sb{font:inherit;font-size:14px;padding:7px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;margin-left:6px}
.sb.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#smsg:not(:empty){background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:14px}
.sec h5{font-size:14px;color:var(--mute);margin:20px 2px 8px;font-weight:600}
.ce{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:9px;display:grid;gap:9px}
.sh label{display:block;font-size:12.5px;color:var(--mute)}
.sh input,.sh select{display:block;width:100%;margin-top:3px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.g2.gs{grid-template-columns:1.7fr .8fr}
.g3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:9px}
.lk{font:inherit;font-size:13px;background:none;border:0;color:#D64545;text-align:left;cursor:pointer;padding:2px 0}
.lk.rs{color:var(--mute);margin-top:24px}
.add{font:inherit;font-size:14px;width:100%;padding:10px;border-radius:14px;border:1px dashed var(--mute);background:none;color:var(--ink);cursor:pointer}
.ses{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:9px}
.days{display:flex;gap:6px}
.dc{flex:1;font:inherit;font-size:13px;padding:7px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.dc[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.add.sm{padding:8px;font-size:13px;border-color:var(--line);color:var(--mute)}
.sj{display:flex;align-items:center;gap:12px;width:100%;font:inherit;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:9px;cursor:pointer}
.sj i{width:5px;align-self:stretch;border-radius:5px;flex:none}
.sj span{flex:1;font-weight:600}
.sj em{color:var(--mute);font-style:normal;font-size:20px}
.seg{margin:0 0 12px}.seg .dc{font-size:14px;font-weight:500;padding:10px 0;border-radius:12px}
.sh textarea{display:block;width:100%;margin-top:3px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:140px;resize:vertical}
.sj span{min-width:0}.sj span small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.sj.past{opacity:.5}
.card.ev h3{font-size:15px;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{padding:26px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:16px}

/* timeline class list */
.row{display:grid;grid-template-columns:68px 14px 1fr;column-gap:8px;margin-bottom:9px}
.row .rt{text-align:right;padding-top:13px;line-height:1.15;font-variant-numeric:tabular-nums}
.row .rt b{font-family:Georgia,'Times New Roman',serif;font-weight:800;font-size:18px}
.row .rt b em{font-style:normal;font-size:11px;font-weight:600;color:var(--mute);margin-left:2px}
.row .rt small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:50%;top:0;bottom:-9px;width:2px;margin-left:-1px;background:var(--line)}
.rail i{position:absolute;left:50%;top:18px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg)}
.row:first-child .rail::before{top:23px}
.row:last-child .rail::before{bottom:auto;height:23px}
.row:first-child:last-child .rail::before{display:none}
.row.brkr .rt{padding-top:10px}
.row.brkr .rt b{font-size:15px;color:var(--mute)}
.row.brkr .rail i{top:15px;background:var(--bg);border:2px solid var(--mute);width:10px;height:10px;box-shadow:0 0 0 3px var(--bg)}
.cc.brk{padding:9px 14px;background:var(--soft);border-style:dashed}
.cc.brk .bk{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cc.brk .bk b{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.cc.brk .du{font-size:14px;font-weight:700;padding:3px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.nb.br{background:var(--mute)}
.cc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;min-width:0}
.cc.hasmo{cursor:pointer}
.cc .ct{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--c);font-variant-numeric:tabular-nums}
.cc h3{font-size:16.5px;font-weight:600;line-height:1.3;margin:3px 0 9px}
.cc .rr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cc .rm{font-size:14.5px;font-weight:700;padding:3px 12px;border-radius:10px;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.cc .chev{color:var(--mute);font-size:20px;line-height:1;transition:transform .2s}
.cc.open .chev{transform:rotate(90deg)}
.cc .mo{display:none;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--mute)}
.cc.open .mo{display:block}
.cc .mo .tel{color:var(--ink);font-weight:500}
.nb{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:var(--c);color:#fff;padding:2px 8px;border-radius:99px}
.nb.dn{background:var(--soft);color:var(--mute)}
.cc.next{background:color-mix(in srgb,var(--c) 9%,var(--card));border-color:var(--c)}
.row.done .rt,.row.done .cc{opacity:.45}
.now .meta span.rm{font-size:16px;font-weight:700;padding:4px 14px;background:rgba(255,255,255,.24)}
.now .meta span.dt{background:none;padding:2px 4px;font-size:13px;opacity:.85}
.now.hasmo{cursor:pointer}
.now .mo{display:none;margin-top:12px;font-size:14px;opacity:.92}
.now.open .mo{display:block}
.mo .ctl{margin-bottom:9px}
.sch{display:grid;gap:6px}
.sr{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums}
.sr .day{min-width:40px;text-align:center;font-size:12px;font-weight:600;padding:4px 0;border-radius:8px;background:var(--soft);color:var(--mute)}
.sr.cur .day{background:var(--ink);color:var(--bg)}
.sr.cur{font-weight:600}
.sr em{margin-left:auto;font-style:normal;color:var(--mute);font-size:12.5px;font-weight:600}
.now .mo .sr,.now .mo .sr em{color:#fff}
.now .mo .sr .day{background:rgba(255,255,255,.2);color:#fff}
.now .mo .sr.cur .day{background:#fff;color:var(--c)}
.cc .ctl2{font-size:13.5px;color:var(--mute);margin:-5px 0 9px}
.cc .ctl2 .tel{color:var(--ink);font-weight:500}
.now .ctl2{font-size:14px;opacity:.9;margin:-2px 0 10px}
.cc,.now{position:relative;overflow:hidden}
.cc.hasev{padding-right:32px}
.now.hasev{padding-right:38px!important}
.evs{position:absolute;top:0;right:0;bottom:0;width:14px;display:flex;flex-direction:column}
.evs i{flex:1;display:block}
.now .evs{width:16px;border-left:2px solid rgba(255,255,255,.85)}
.en{border-left:4px solid var(--p);padding:2px 0 2px 10px;margin-bottom:9px}
.en small{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.en div{font-size:13.5px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.now .en{background:rgba(255,255,255,.14);padding:5px 10px;border-radius:0 8px 8px 0}
.now .en small{color:#fff;opacity:.85}.now .en div{color:#fff}
.sw{position:relative;margin-bottom:9px;border-radius:18px;overflow:hidden}
.sw .card,.sw .sj{margin-bottom:0}
.swd{position:absolute;left:0;top:0;bottom:0;width:84px;border:0;background:#000;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.swc{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.sw.open .swc{transform:translateX(84px)}
@media (prefers-reduced-motion:reduce){#slot>article{animation:none}.bar i{transition:none}}

/* ===== e-paper: pure black & white, no tint, no motion ===== */
:root:root:root{--bg:#fff;--card:#fff;--ink:#000;--mute:#4d4d4d;--line:#000;--soft:#eee;--tbg:#fff;color-scheme:light}
*,*::before,*::after{animation:none!important;transition:none!important}
body{background:#fff;color:#000}
.row,.now,.cc,.card,.timer,.sj{--c:#000!important}
.top{border:2px solid #000;border-radius:16px}
.top select{background:#fff;border:1.5px solid #000;color:#000}
.top .pill{background:#000;color:#fff;border:1.5px solid #000}
button:focus-visible,.top select:focus-visible{outline:3px solid #000;outline-offset:2px}
#slot>article.now,#slot>article.timer{background:#fff;color:#000;border:2px solid #000}
.tag{background:none;border:1.5px solid #000;color:#000}
.now .code,.rl,.rl.s,.timer .lbl,.now .ctl2,.now .mo{opacity:1}
.now .meta span{background:none;border:1px solid #000;color:#000}
.now .meta span.rm{background:#fff;border:2px solid #000}
.now .meta span.dt{border:0;text-decoration:underline}
.bar{background:#fff;border:1.5px solid #000;height:12px}
.bar i{background:#000}
.timer .up{border-top:1.5px solid #000}
.timer .up i{background:#000!important}
.timer .up small{opacity:1;color:#4d4d4d}
.now .mo .sr,.now .mo .sr em{color:#000}
.now .mo .sr .day{background:#fff;border:1px solid #000;color:#000}
.now .mo .sr.cur .day{background:#000;color:#fff}
.rail::before{background:#000}
.rail i{background:#000;box-shadow:0 0 0 3px #fff}
.row.brkr .rail i{background:#fff;border:2px solid #000}
.row .rt b em,.row .rt small{color:#4d4d4d}
.row.brkr .rt b{color:#4d4d4d}
.row.done .rt,.row.done .cc{opacity:.5}
.cc{border:1.5px solid #000;border-radius:14px}
.cc .ct{color:#000}
.cc .rm{background:#fff;border:2px solid #000;color:#000}
.cc.next{background:#fff;border-color:#000;box-shadow:inset 0 0 0 1.5px #000}
.cc.brk{background:#fff;border:1.5px dashed #000}
.cc.brk .du{background:#fff;border:1.5px solid #000}
.nb,.nb.br{background:#000;color:#fff}
.nb.dn{background:#fff;color:#000;border:1px solid #000}
.sr .day{background:#fff;border:1px solid #000;color:#000}
.sr.cur .day{background:#000;color:#fff}
.sr em{color:#4d4d4d}
/* event priority strip: black = high, hatch = medium, dots = low */
.evs{border-left:1.5px solid #000}
.now .evs{border-left:1.5px solid #000}
.evs i[data-p=high]{background:#000!important}
.evs i[data-p=medium]{background:repeating-linear-gradient(135deg,#000 0 2px,#fff 2px 5px)!important}
.evs i[data-p=low]{background:radial-gradient(#000 1.2px,transparent 1.6px) 0 0/6px 6px,#fff!important}
.evs i+i{border-top:1.5px solid #000}
.en,.now .en{--p:#000!important;border-left:4px solid #000;background:none;border-radius:0}
.now .en small,.now .en div{color:#000;opacity:1}
.card{border:1.5px solid #000}
.card .st{background:#000}
.empty{border:1.5px dashed #000;background:#fff}
.sj{border:1.5px solid #000}
.sj i{background:#000!important}
.tabs button.today::after{background:#000}
.lk{color:#000;text-decoration:underline}
.cp{margin:28px 0 0;padding-top:14px;border-top:1.5px solid #000;text-align:center;font-size:12.5px;color:#4d4d4d;line-height:1.5}
.cp b{color:#000;font-weight:700}
.cp a{color:#000;text-decoration:underline;text-underline-offset:2px}

/* Study Illustration Section - Polished */
.study-section{text-align:center;margin:24px 0 12px;padding:6px 0}
.study-art{display:flex;justify-content:center;align-items:center;margin-bottom:6px;color:var(--ink)}
.study-svg{overflow:visible}
.study-msg .study-title{font-family:Georgia,'Times New Roman',serif;font-weight:800;font-size:18px;color:var(--ink);margin-bottom:3px;letter-spacing:-0.01em}
.study-msg .study-sub{font-size:13px;color:var(--mute);font-weight:500}

@keyframes bookGentleOpen {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(0.96) translateY(1px); }
}

@keyframes cupFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2.5px); }
}

@keyframes pencilSubtleFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-3.5px) rotate(-1deg); }
}

@keyframes steamRiseSubtle {
  0% { opacity: 0; transform: translateY(3px) scale(0.8); }
  50% { opacity: 0.75; transform: translateY(-2px) scale(1); }
  100% { opacity: 0; transform: translateY(-6px) scale(1.1); }
}

@keyframes sparkleFadeSubtle {
  0% { opacity: 0; transform: translateY(3px) scale(0.6); }
  50% { opacity: 0.85; transform: translateY(-3px) scale(1.15); }
  100% { opacity: 0; transform: translateY(-8px) scale(0.5); }
}

.study-art .book-group {
  transform-origin: 100px 54px;

<script id="app" type="text/plain">
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday'],SHORT=['Sun','Mon','Tue','Wed','Thu'];
const PAL=['#1D5FA8','#2E7D4F','#B8650F','#8A3E8A','#0F7A74','#B3392F','#8A6B00','#4B5BA6','#9C3D63'];
// Default routine: [startPeriod,endPeriod,code,teacher,room] per day (period 1 = 1:30 PM, 45 min each)
const RAW=[
 [[1,2,'28543','US','2206'],[3,4,'28542','MIS','2206'],[5,5,'26841','NMS','2105'],[6,6,'25831','MOF','2105'],[7,7,'29041','SP','2105']],
 [[1,2,'28543','US','2105'],[3,4,'28544','AK','2206'],[5,6,'26841','NMS','2102']],
 [[1,1,'26841','NMS','2306'],[2,2,'25831','MOF','2306'],[3,4,'29041','SP','1109'],[5,6,'28541','MAH','2105']],
 [[3,4,'28542','MIS','2105'],[5,5,'28544','AK','2206'],[6,7,'28541','MAH','2206']],
 [[2,2,'28543','US','1234'],[3,3,'29041','SP','1234'],[5,6,'28544','AK','2206']]];
const SL=[['28543','Computer Peripherals & Interfacing','Umma Salma','01791609120'],['28542','Data Structure & Algorithm','Monirul Islam Shisir','01718583511'],['26841','Digital Electronics-2','Nadim Mahmud',''],['25831','Business Communication','Omor Faruk','01737597573'],['29041','Environmental Studies','Shehad Ahmed Piash','07144516954'],['28544','Web Design & Development-1','Alamgir Kabir','01719469313'],['28541','Java Programming','Md. Ariful Hasan','01714517335']];
const DEF={v:2,subjects:SL.map(([code,name,teacher,phone],i)=>{const m={};
 RAW.forEach((d,di)=>d.forEach(([a,b,c,t,room])=>{if(c!==code)return;const st=810+(a-1)*45,en=810+b*45,k=st+'|'+en+'|'+room;(m[k]=m[k]||{days:[],start:st,end:en,room}).days.push(di)}));
 return{name,code,teacher,phone,color:PAL[i],sessions:Object.values(m)}})};
const clone=o=>JSON.parse(JSON.stringify(o)),KEY='cst-routine-v2';
function load(){try{const j=JSON.parse(Store.get(KEY));if(j&&j.v===2&&Array.isArray(j.subjects))return j}catch(e){}return clone(DEF)}
function persist(){try{Store.set(KEY,JSON.stringify(CFG))}catch(e){}}
let CFG=load(),SCH=[];
function build(){SCH=[[],[],[],[],[]];
 CFG.subjects.forEach(x=>x.sessions.forEach(se=>se.days.forEach(d=>{if(SCH[d])SCH[d].push({ph:x.phone||'',s:se.start*60,e:se.end*60,code:x.code,room:se.room,name:x.name,teacher:x.teacher,col:x.color})})));
 SCH.forEach(d=>d.sort((p,q)=>p.s-q.s))}
build();
const tel=b=>b.ph?`<a class="tel" href="tel:${b.ph}">${b.ph}</a>`:'';
const bn=n=>String(n),pad=n=>String(n).padStart(2,'0');
function clock(sec){let h=Math.floor(sec/3600)%24,m=Math.floor(sec/60)%60,ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+ap}
const range=b=>clock(b.s)+' – '+clock(b.e);
const subjectDays=name=>{
  const days=new Set();
  CFG.subjects.filter(x=>x.name===name).forEach(x=>x.sessions.forEach(se=>se.days.forEach(d=>days.add(d))));
  return [...days].sort((a,b)=>a-b);
};
const dayMarks=(name,today)=>subjectDays(name).map(d=>`<span class="day${d===today?' today':''}">${SHORT[d]}</span>`).join('');
const ctHTML=(b,c)=>{const t=[b.teacher,b.ph&&tel(b)].filter(Boolean).join(' · ');return t?`<div class="${c}">${t}</div>`:''};
const isoOf=t=>{const d=new Date(t+432e5);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const evFor=(name,iso)=>EV.filter(e=>e.subject===name&&e.date===iso).sort((a,c)=>PR[c.priority]-PR[a.priority]);
const strip=ev=>ev.length?`<div class="evs">${ev.map(e=>`<i data-p="${e.priority}" style="background:${PCOL[e.priority]}"></i>`).join('')}</div>`:'';
const notes=ev=>ev.map(e=>`<div class="en" style="--p:${PCOL[e.priority]}"><small>Event · ${PL[e.priority]} priority</small><div>${esc(e.text)}</div></div>`).join('');
const moHTML=(b,hi,ev)=>{
  const rows=[];
  SCH.forEach((day,d)=>day.filter(x=>x.name===b.name).forEach(x=>rows.push(`<div class="sr${d===hi?' cur':''}"><span class="day">${SHORT[d]}</span><span>${range(x)}</span>${x.room?`<em>${x.room}</em>`:''}</div>`)));
  return notes(ev||[])+`<div class="sch">${rows.join('')}</div>`};
function human(sec){const m=Math.round(sec/60);if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+r+' min':'')}
function fmtM(ms){const m=Math.max(0,Math.ceil(ms/60000)),d=Math.floor(m/1440),h=Math.floor(m%1440/60),r=m%60;
 return [d&&d+' d',h&&h+' h',(r||!(d||h))&&r+' min'].filter(Boolean).join(' ')}
function fmt(ms){let s=Math.max(0,Math.ceil(ms/1000));const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
 return (d?d+'d ':'')+(h||d?h+':':'')+pad(m)+':'+pad(x)}

function state(now){
  const wd=now.getDay(),mid=new Date(now).setHours(0,0,0,0),secs=(now-mid)/1000,today=wd<=4?SCH[wd]:[];
  const cur=today.find(b=>secs>=b.s&&secs<b.e);
  if(cur)return{kind:'now',cur,wd,mid,secs,i:today.indexOf(cur)};
  const up=today.find(b=>b.s>secs);
  if(up){const i=today.indexOf(up);return{kind:i?'gap':'before',nxt:up,wd,mid,secs,tgt:mid+up.s*1000}}
  for(let k=1;k<=7;k++){const d=(wd+k)%7;if(d<=4&&SCH[d].length)
    return{kind:today.length&&wd<=4?'after':'off',nxt:SCH[d][0],nd:d,wd,mid,secs,tgt:mid+k*864e5+SCH[d][0].s*1000}}
  return{kind:'empty',wd,mid,secs}
}

function slot(st){
  const S=document.getElementById('slot');
  if(st.kind==='now'){const b=st.cur;
    const ev=evFor(b.name,todayISO()),mo=moHTML(b,st.wd,ev);
    S.innerHTML=`<article class="now${mo?' hasmo':''}${ev.length?' hasev':''}" style="--c:${b.col}">${strip(ev)}<span class="tag">Live now</span>
    <div class="code">${b.code?b.code+' · ':''}${range(b)}</div><h2>${b.name}</h2>${ctHTML(b,'ctl2')}
    <div class="meta">${b.room?`<span class="rm">Room ${b.room}</span>`:''}${mo?'<span class="dt">Details ›</span>':''}</div>${mo?`<div class="mo">${mo}</div>`:''}
    <div class="foot"><div class="rl"><span>Time left</span><b id="rem"></b></div>
    <div class="bar"><i id="bar"></i></div><div class="rl s"><span>Starts ${clock(b.s)}</span><span>Ends ${clock(b.e)}</span></div></div></article>`;
    return}
  if(st.kind==='empty'){S.innerHTML=`<article class="timer"><div class="msg" style="margin-top:0">No routine yet.</div><div class="lbl">Open Controls to add your subjects.</div></article>`;return}
  const T={gap:'Break',before:'Classes start soon',after:'All classes are done for today.',off:'No classes today'}[st.kind],n=st.nxt;
  const when=st.nd!==undefined?DAYS[st.nd]+', ':'';
  S.innerHTML=`<article class="timer">${st.kind==='after'?'':`<span class="tag">${T}</span>`}
   <div class="msg">${st.kind==='after'?'All classes are done for today.':st.kind==='off'?'No classes today.':st.kind==='gap'?'Enjoy your break.':'A new day begins.'}</div>
   <div class="lbl">${st.kind==='after'?'Time to recharge.':st.kind==='off'?'Enjoy the day.':st.kind==='before'?'Ready for today?':'Next class starts in'}${st.kind==='after'||st.kind==='off'||st.kind==='before'?'': ' <b id="cdv"></b>'}</div>
   ${st.kind==='after'||st.kind==='off'||st.kind==='before'?`<div class="lbl">Next class starts in <b id="cdv"></b></div>`:''}
   <div class="up"><i style="background:${n.col}"></i><div><small>Next class · ${when}${range(n)}</small><b>${n.name}</b>
   <small>${n.room?'Room '+n.room:''}</small></div></div></article>`;
}

let sel=0,lastKey='',curSt=null,listMeta=[];
function list(st){
  const L=document.getElementById('list'),B=SCH[sel],isT=sel===st.wd;
  const dd=(sel-st.wd+7)%7,base=st.mid+dd*864e5,iso=isoOf(base);let h='';listMeta=[];
  document.getElementById('hd').textContent=`${DAYS[sel]} · ${B.length} ${B.length===1?'class':'classes'}`+(isT?' · Today':'');
  const nx=isT?B.findIndex(x=>st.secs<x.s):-1,tm=t=>{const c=clock(t).split(' ');return `<b>${c[0]}<em>${c[1]}</em></b>`};
  B.forEach((b,i)=>{
    const live=isT&&st.secs>=b.s&&st.secs<b.e;if(live)return;
    const p=B[i-1],pl=p&&isT&&st.secs>=p.s&&st.secs<p.e;
    if(p&&!pl&&b.s>p.e){const bd=isT&&st.secs>=b.s,bn=isT&&st.secs>=p.e&&st.secs<b.s;
      h+=`<div class="row brkr${bd?' done':''}" style="--c:var(--mute)"><div class="rt">${tm(p.e)}<small>– ${clock(b.s)}</small></div><div class="rail"><i></i></div><div class="cc brk"><div class="bk"><b>Break${bn?'<span class="nb br">Now</span>':''}</b><span class="du">${human(b.s-p.e)}</span></div></div></div>`}
    const done=isT&&st.secs>=b.e,key=b.code+'|'+b.s+'|'+b.room,ev=evFor(b.name,iso),mo=moHTML(b,sel,ev);
    const badge=done?'<span class="nb dn">Finished</span>':i===nx?'<span class="nb">Next</span>':'';
    h+=`<div class="row${done?' done':''}" style="--c:${b.col}"><div class="rt">${tm(b.s)}<small>– ${clock(b.e)}</small></div><div class="rail"><i></i></div>
     <div class="cc${i===nx?' next':''}${mo?' hasmo':''}${ev.length?' hasev':''}${OPEN.has(key)?' open':''}" data-k="${esc(key)}">${strip(ev)}<div class="ct"><span>${b.code}</span>${badge}</div><h3>${b.name}</h3>${ctHTML(b,'ctl2')}
     <div class="rr">${b.room?`<span class="rm">Room ${b.room}</span>`:'<span></span>'}${mo?'<span class="chev">›</span>':''}</div>${mo?`<div class="mo">${mo}</div>`:''}</div></div>`;
  });
  L.innerHTML=h||'<div class="empty">No classes on this day</div>';
}
function tabs(wd){
  const T=document.getElementById('dayPicker');
  if(!T)return;
  T.innerHTML='';
  SHORT.forEach((n,i)=>{
    const o=document.createElement('option');
    o.value=i;o.textContent=DAYS[i]+(i===new Date().getDay()?' •':'');o.selected=i===sel;T.appendChild(o);
  });
  T.onchange=()=>{sel=+T.value;lastKey='';tick()};
}
const OPEN=new Set();
document.getElementById('evl').addEventListener('click',e=>{const b=e.target.closest('[data-act=evx]');if(!b)return;EV.splice(+b.dataset.k,1);saveEV();renderEvents();lastKey='';curSt=null;tick()});
document.getElementById('list').addEventListener('click',e=>{if(e.target.closest('a'))return;const c=e.target.closest('.cc.hasmo');if(!c)return;const k=c.dataset.k;c.classList.toggle('open');c.classList.contains('open')?OPEN.add(k):OPEN.delete(k)});
document.getElementById('slot').addEventListener('click',e=>{if(e.target.closest('a'))return;const c=e.target.closest('.now.hasmo');if(c)c.classList.toggle('open')});
let first=true;
function tick(){
  const now=new Date(),st=state(now);
  {const h=now.getHours();document.getElementById('clk').innerHTML=`<span class="hm">${h%12||12}:${pad(now.getMinutes())}</span><span class="ap">${h>=12?'PM':'AM'}</span>`}
  const key=[sel,st.kind,st.cur?st.cur.s:'',st.nxt?st.nxt.s:'',st.wd].join('|');
  if(key!==lastKey){
    const sk=[st.kind,st.cur?st.cur.s:'',st.nxt?st.nxt.s:''].join('|');
    if(sk!==(curSt||'')){slot(st);curSt=sk}
    list(st);renderEvents();lastKey=key;
  }
  const nowMs=+now;
  if(st.kind==='now'){const b=st.cur,e=st.mid+b.e*1000,tot=(b.e-b.s)*1000;
    document.getElementById('rem').textContent=fmtM(e-nowMs);
    document.getElementById('bar').style.width=Math.min(100,Math.max(0,(1-(e-nowMs)/tot)*100))+'%'}
  else{const c=document.getElementById('cdv');if(c)c.textContent=fmtM(st.tgt-nowMs)}
}
const EKEY='cst-events-v1',PR={low:0,medium:1,high:2},PL={low:'Low',medium:'Medium',high:'High'},PCOL={low:'#3E9B6B',medium:'#E39B1B',high:'#D64545'};
let EV=(()=>{try{const j=JSON.parse(Store.get(EKEY));if(Array.isArray(j))return j}catch(e){}return[]})();
const saveEV=()=>{try{Store.set(EKEY,JSON.stringify(EV))}catch(e){}};
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fd=ds=>new Date(ds+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short'});
let evDraft=null,evIdx=null,clrArm=false;
function renderEvents(){
 const mid=new Date().setHours(0,0,0,0),H=document.getElementById('evh'),L=document.getElementById('evl');
 const up=EV.map((e,ix)=>({...e,ix,dd:Math.round((new Date(e.date+'T00:00:00')-mid)/864e5)})).filter(e=>e.dd>=0&&!e.subject).sort((a,b)=>a.dd-b.dd||PR[b.priority]-PR[a.priority]);
 H.textContent=up.length?'Upcoming events':'';
 L.innerHTML=up.map(e=>`<div class="sw"><button class="swd" data-act="evx" data-k="${e.ix}">Delete</button><div class="swc"><article class="card ev" style="--c:${PCOL[e.priority]}"><div class="st"></div><div class="bd"><div class="tm">${esc(e.subject||'General')} · ${fd(e.date)}</div><h3>${esc(e.text)}</h3></div><div class="sd"><b>${e.dd===0?'Today':e.dd===1?'Tomorrow':e.dd+' days'}</b><small>${PL[e.priority]} priority</small></div></article></div></div>`).join('')}
const seg=a=>`<div class="days seg"><button type="button" class="dc" data-act="tabr" aria-pressed="${a==='r'}">Routines</button><button type="button" class="dc" data-act="events" aria-pressed="${a==='e'}">Events</button></div>`;
function evListHTML(box){
 const idx=EV.map((e,i)=>i).sort((a,b)=>EV[a].date.localeCompare(EV[b].date)),t=todayISO();
 return `<div class="sh"><header><b>Controls</b><div><button class="sb" data-act="cancel">Cancel</button><button class="sb pri" data-act="save">Save</button></div></header>${box}${seg('e')}<button class="add" data-act="evnew">+ Add events</button><div class="sec"><h5>${EV.length?'Your events':'No events yet'}</h5>`
  +idx.map(i=>{const e=EV[i];return `<div class="sw"><button class="swd" data-act="evx" data-k="${i}">Delete</button><div class="swc"><button class="sj${e.date<t?' past':''}" data-act="evopen" data-k="${i}"><i style="background:${PCOL[e.priority]}"></i><span>${esc(e.text.split('\n')[0].slice(0,60))}<small>${esc(e.subject||'General')} · ${fd(e.date)}</small></span><em>›</em></button></div></div>`}).join('')+`</div></div>`}
function evFormHTML(box){
 const E=evDraft,names=CFG.subjects.map(x=>x.name).filter(Boolean);if(E.subject&&!names.includes(E.subject))names.push(E.subject);
 return `<div class="sh"><header><button class="sb" data-act="evlist">‹ Events</button><button class="sb pri" data-act="evsave">Save event</button></header>${box}<div class="ce">
  <label>Note<textarea data-e="text" rows="6" placeholder="e.g. Class test on chapters 3–4. Bring a calculator.">${esc(E.text)}</textarea></label>
  <label>Subject<select data-e="subject"><option value="">General (no subject)</option>${names.map(n=>`<option value="${esc(n)}"${n===E.subject?' selected':''}>${esc(n)}</option>`).join('')}</select></label>
  <label>Date<input type="date" data-e="date" value="${E.date}"></label>
  <div><label>Priority</label><div class="days" style="margin-top:4px">${['low','medium','high'].map(p=>`<button type="button" class="dc" data-act="pri" data-v="${p}" aria-pressed="${E.priority===p}">${PL[p]}</button>`).join('')}</div></div></div>
  ${evIdx!==null?'<button class="lk" data-act="evdel">Delete event</button>':''}</div>`}
const sheet=document.getElementById('sheet');let draft=null;
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const NEWS=()=>({days:[],start:810,end:855,room:''});
let view=null;
function renderSheet(msg){
 const y=sheet.scrollTop,D=draft,box=`<div id="smsg" role="alert">${msg||''}</div>`;let h;
 if(view==='events')h=evListHTML(box);

function validate(D){
 for(const x of D.subjects){if(!x.name.trim())return 'Every subject needs a name.';
  for(const se of x.sessions){if(!se.days.length)return x.name+': select at least one day.';
   if(se.end<=se.start)return x.name+': end time must be after start time.'}}
 for(let d=0;d<5;d++){const L=[];D.subjects.forEach(x=>x.sessions.forEach(se=>{if(se.days.includes(d))L.push([se.start,se.end,x.name])}));
  L.sort((p,q)=>p[0]-q[0]);
  for(let i=1;i<L.length;i++)if(L[i][0]<L[i-1][1])return DAYS[d]+': '+L[i-1][2]+' and '+L[i][2]+' overlap.'}
 return ''}

 const k=p.split('.');let o=draft;for(let n=0;n<k.length-1;n++)o=o[k[n]];o[k[k.length-1]]=v}
function onEv(e){const k=e.target.dataset.e;if(k&&evDraft)evDraft[k]=e.target.value}
sheet.addEventListener('input',e=>{onEdit(e);onEv(e)});sheet.addEventListener('change',e=>{onEdit(e);onEv(e)});
sheet.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,k=+b.dataset.k,i=+b.dataset.i,d=+b.dataset.d,D=draft;let go=0;
 if(a==='events'||a==='evlist'){view='events';go=1}
 if(a==='tabr'){view=null;go=1}
 if(a==='evnew'){evDraft={text:'',subject:'',date:todayISO(),priority:'medium'};evIdx=null;view='ev';go=1}
 if(a==='evopen'){evDraft=clone(EV[k]);evIdx=k;view='ev';go=1}
 if(a==='pri')evDraft.priority=b.dataset.v;
 if(a==='evsave'){if(!evDraft.text.trim()||!evDraft.date)return renderSheet('Write a note and pick a date.');
  const E={...evDraft,text:evDraft.text.trim()};if(evIdx===null){E.id='e'+Date.now().toString(36);EV.push(E)}else EV[evIdx]=E;
  saveEV();renderEvents();lastKey='';curSt=null;tick();view='events';go=1}
 if(a==='evx'){EV.splice(k,1);saveEV();renderEvents();lastKey='';curSt=null;tick();view='events';go=1}
 if(a==='evdel'){EV.splice(evIdx,1);saveEV();renderEvents();lastKey='';curSt=null;tick();view='events';go=1}
 if(a==='cancel'){sheet.classList.remove('open');return}
 if(a==='save'){const er=validate(D);if(er){renderSheet(er);sheet.scrollTop=0;return}
  CFG=D;persist();build();sheet.classList.remove('open');lastKey='';curSt=null;tick();return}
 if(a==='day'){const A=D.subjects[k].sessions[i].days,x=A.indexOf(d);if(x<0)A.push(d);else A.splice(x,1);A.sort()}
 if(a==='adds')D.subjects[k].sessions.push(NEWS());
 if(a==='dels')D.subjects[k].sessions.splice(i,1);
 if(a==='delx'){D.subjects.splice(k,1);view=null;go=1}
 if(a==='open'){view=k;go=1}
 if(a==='back'){view=null;go=1}
 if(a==='addx'){D.subjects.push({name:'',code:'',teacher:'',phone:'',color:PAL[D.subjects.length%PAL.length],sessions:[NEWS()]});view=D.subjects.length-1;go=1}
 if(a==='clear'){if(!clrArm){clrArm=true;return renderSheet()}
  clrArm=false;CFG={v:2,subjects:[]};persist();EV=[];saveEV();OPEN.clear();build();sheet.classList.remove('open');lastKey='';curSt=null;tick();return}
 if(a!=='clear')clrArm=false;
 renderSheet();if(go)sheet.scrollTop=0});
(function(){const W=84;let c=null,x0=0,y0=0,o0=0,drag=false,last=0;
 const closeAll=k=>document.querySelectorAll('.sw.open').forEach(w=>{if(w!==k)w.classList.remove('open')});
 document.addEventListener('pointerdown',e=>{const el=e.target.closest('.swc');if(!el||e.target.closest('.swd'))return;c=el;x0=e.clientX;y0=e.clientY;drag=false;o0=el.parentElement.classList.contains('open')?W:0});
 document.addEventListener('pointermove',e=>{if(!c)return;const dx=e.clientX-x0,dy=e.clientY-y0;
  if(!drag){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){drag=true;closeAll(c.parentElement);try{c.setPointerCapture(e.pointerId)}catch(_){}}else return}
  c.style.transform='translateX('+Math.max(0,Math.min(W,o0+dx))+'px)'});
 const end=e=>{if(!c)return;if(drag){const m=/translateX\(([\d.]+)px/.exec(c.style.transform),v=m?+m[1]:0;c.style.transform='';c.parentElement.classList.toggle('open',v>W/2);last=Date.now()}c=null;drag=false};
 document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
 document.addEventListener('click',e=>{if(e.target.closest('.swd'))return;const el=e.target.closest('.swc');if(Date.now()-last<250){e.stopPropagation();e.preventDefault();return}
  if(el&&el.parentElement.classList.contains('open')&&!e.target.closest('.swd')){e.stopPropagation();e.preventDefault();el.parentElement.classList.remove('open')}},true)})();

<script>
/* Storage: native Preferences (Capacitor) with localStorage fallback/backup.
   Values are loaded into memory first, then the app starts. */
var Store=(function(){
  var cache={},P=null;
  try{var C=window.Capacitor;if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins)P=C.Plugins.Preferences||null}catch(e){}
  function ls(){try{return window.localStorage}catch(e){return null}}
  return{
    init:async function(keys){
      for(var i=0;i<keys.length;i++){
        var k=keys[i],v=null;
        if(P){try{var r=await P.get({key:k});v=r&&r.value!=null?r.value:null}catch(e){}}
        if(v==null){var l=ls();try{v=l?l.getItem(k):null}catch(e){}}
        cache[k]=v;
      }
    },
    get:function(k){return k in cache?cache[k]:null},
    set:function(k,v){
      cache[k]=v;
      if(P){try{P.set({key:k,value:v})}catch(e){}}
      var l=ls();try{if(l)l.setItem(k,v)}catch(e){}
    }
  };
})();
(async function(){
  try{await Store.init(['cst-routine-v2','cst-events-v1'])}catch(e){}
  var s=document.createElement('script');
  s.text=document.getElementById('app').text;
  document.body.appendChild(s);
})();
/* Open external links in the system browser inside the Capacitor app */
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[target="_blank"]');if(!a)return;
  try{var C=window.Capacitor;
    if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Browser){
      e.preventDefault();C.Plugins.Browser.open({url:a.href});
    }
  }catch(err){}
});

const pSheet=document.getElementById('profileSheet');
document.getElementById('profileBtn').onclick=()=>{renderProfileSheet();pSheet.classList.add('open');pSheet.scrollTop=0};
pSheet.addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='p-cancel'){pSheet.classList.remove('open');return}
    if(a==='p-save'){
      const inp=document.getElementById('pNameInput');
      if(inp)userProfile.name=inp.value.trim()||'Student';
      saveProfile();pSheet.classList.remove('open');return;
    }
    if(a==='p-photo'){
      const fi=document.getElementById('pAvatarInput');
      if(fi){
        fi.onchange=ev=>{
          const f=ev.target.files[0];
          if(f){
            const r=new FileReader();
            r.onload=evt=>{
              userProfile.photo=evt.target.result;
              saveProfile();
              renderProfileSheet();
            };
            r.readAsDataURL(f);
          }
        };
        fi.click();
      }
    }
  }
});
